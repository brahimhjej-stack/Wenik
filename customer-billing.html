<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WENIK · My membership</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#10091b;color:#fff;font:17px system-ui}.wrap{max-width:560px;margin:50px auto;padding:24px}.card{border:1px solid #693f85;border-radius:22px;padding:24px;background:#1b112b}h1{font-size:28px}.price{color:#ffd43b;font-size:26px;font-weight:800}p{line-height:1.5;color:#d0bfdc}a,button{display:block;text-align:center;border:0;border-radius:14px;background:#ffc03a;color:#180920;padding:15px;margin-top:16px;font:inherit;font-weight:700;text-decoration:none}a.back{background:transparent;color:#ffc03a}button:disabled{opacity:.5}</style></head><body><main class="wrap"><h1>WENIK · My membership</h1><section class="card"><div id="price" class="price"></div><p id="status" role="status">Loading membership…</p><p id="expiry"></p><p>Each monthly payment requires your confirmation. Automatic renewal is not active.</p><a id="pay" href="whish-payment.html" hidden>Pay with Whish</a><button id="refresh">Refresh status</button></section><a class="back" href="/">Back to WENIK</a></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const status=document.getElementById('status'),price=document.getElementById('price'),expiry=document.getElementById('expiry'),pay=document.getElementById('pay'),refresh=document.getElementById('refresh');
async function load(){refresh.disabled=true;pay.hidden=true;try{const response=await fetch('/api/whish/config');if(!response.ok)throw Error('Membership payments are not available yet.');const config=await response.json();const sb=createClient(config.supabaseUrl,config.publishableKey);const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please sign in to WENIK first, then return to My membership.');const{data,error}=await sb.rpc('customer_my_billing_status');if(error||!data)throw Error('Unable to load your membership. Please try again.');price.textContent=Number(data.monthlyFee).toFixed(2)+' '+data.currency+' / month';status.textContent=config.environment==='sandbox'?'Sandbox test · real membership is unchanged.':data.active?'Your membership is active.':'No active paid membership.';expiry.textContent=data.paidUntil?'Paid until '+new Date(data.paidUntil).toLocaleDateString():'';pay.hidden=!config.checkoutEnabled;pay.textContent=config.environment==='sandbox'?'Test payment with Whish':'Pay with Whish';if(!config.checkoutEnabled)status.textContent+=' Payments will open at launch.';}catch(e){status.textContent=e.message;}finally{refresh.disabled=false;}}
refresh.onclick=load;load();
</script></body></html>
