<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>WENIK Partner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080d;color:#fff;font:16px Arial,sans-serif;min-height:100vh}main{max-width:720px;margin:auto;padding:26px 26px 60px}.logo{width:205px;max-width:48vw;display:block;margin-bottom:26px}.hero,.card{border:1px solid #302d39;border-radius:34px;padding:30px;margin:18px 0;background:linear-gradient(135deg,#1e1026,#20120f)}.card{border-radius:28px;background:#111118}.eyebrow{color:#d69aff;letter-spacing:5px;font-size:14px}.muted{color:#a9a5ae;line-height:1.45}h1,h2{margin:12px 0;font-size:clamp(34px,9vw,52px)}.field,.btn{width:100%;border-radius:22px;border:1px solid #373440;background:#0d0d12;color:#fff;padding:18px 22px;font-size:18px;margin-top:14px}.btn{border:0;font-weight:800;background:linear-gradient(90deg,#da78ec,#ff837e,#ffd553);color:#101014}.btn.secondary{background:#24232d;color:#fff;border:1px solid #3b3944}.hidden{display:none!important}video{width:100%;border-radius:22px;background:#000;aspect-ratio:1/1;object-fit:cover}.result{font-size:20px;line-height:1.5}.amount{font-size:28px}.success{color:#68e0ba}.error{color:#ff8a8a}@media(max-width:480px){main{padding:22px 18px}.hero,.card{padding:24px}}


/* WENIK PARTNER COLOR REFRESH — visual-only */
:root{
  --purple:#8f24ff;
  --pink:#ef159d;
  --orange:#ff6f21;
  --yellow:#ffd21c;
}
body{
  background:
    radial-gradient(circle at 10% -5%,rgba(143,36,255,.28) 0,transparent 30%),
    radial-gradient(circle at 92% 2%,rgba(255,111,33,.20) 0,transparent 27%),
    radial-gradient(circle at 55% 115%,rgba(239,21,157,.12) 0,transparent 30%),
    linear-gradient(180deg,#070610 0%,#090713 48%,#06050d 100%);
}
.logo{filter:drop-shadow(0 0 18px rgba(239,21,157,.18)) drop-shadow(0 0 26px rgba(255,174,0,.08))}
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 0 0,rgba(143,36,255,.30),transparent 38%),
    radial-gradient(circle at 100% 100%,rgba(255,111,33,.20),transparent 40%),
    linear-gradient(145deg,rgba(30,14,60,.96),rgba(17,11,31,.95) 55%,rgba(34,14,24,.94));
  border-color:rgba(178,92,255,.28);
  box-shadow:0 18px 55px rgba(0,0,0,.38),0 0 0 1px rgba(239,21,157,.08),0 0 34px rgba(143,36,255,.09);
}
.hero::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange),var(--yellow))}
.card{background:linear-gradient(145deg,rgba(23,17,39,.95),rgba(12,11,23,.95));border-color:rgba(178,92,255,.22);box-shadow:0 14px 38px rgba(0,0,0,.28)}
.eyebrow{color:#ff9cdc;text-shadow:0 0 14px rgba(239,21,157,.20)}
h1,h2{background:linear-gradient(90deg,#fff 0%,#f8ecff 60%,#ffe4a3 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.field{border-color:rgba(178,92,255,.24);background:linear-gradient(145deg,rgba(11,9,20,.98),rgba(18,11,26,.96))}
.field:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(239,21,157,.12),0 0 20px rgba(143,36,255,.08)}
.btn{background:linear-gradient(100deg,var(--purple) 0%,var(--pink) 38%,var(--orange) 72%,var(--yellow) 100%);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 10px 28px rgba(239,21,157,.18),0 0 0 1px rgba(255,255,255,.08) inset}
.btn.secondary{background:linear-gradient(145deg,rgba(43,24,68,.95),rgba(22,16,35,.96));color:#fff;border-color:rgba(143,36,255,.38);box-shadow:0 8px 20px rgba(92,33,214,.10)}
video{border:2px solid transparent;background:linear-gradient(#000,#000) padding-box,linear-gradient(135deg,var(--purple),var(--pink),var(--orange),var(--yellow)) border-box;box-shadow:0 16px 38px rgba(143,36,255,.12)}
.success{color:#79f1c6}.error{color:#ff93a8}

</style>
</head>
<body><main>
<img class="logo" src="wenik-logo-final.png" alt="WENIK">

<section id="login" class="hero hidden">
  <div class="eyebrow">WENIK PARTNER</div><h1>Partner Login</h1>
  <input id="phone" class="field" placeholder="Mobile" inputmode="tel" autocomplete="tel">
  <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="btn">LOGIN</button><div id="loginMsg" class="muted"></div>
</section>

<section id="app" class="hidden">
  <div class="hero"><div class="eyebrow">PARTNER ACCESS</div><h1 id="business">WENIK Partner</h1><div class="muted">Scan the customer QR to record a visit.</div></div>
  <div id="scanCard" class="card">
    <video id="camera" playsinline muted></video>
    <button id="scanBtn" class="btn">START QR SCAN</button>
    <div id="scanMsg" class="muted"></div>
  </div>
  <div id="customerCard" class="card hidden">
    <div class="eyebrow">CUSTOMER</div><div id="customer" class="result"></div>
    <input id="amount" class="field amount" type="number" min="0.01" step="0.01" placeholder="Bill amount">
    <button id="saveBtn" class="btn">RECORD VISIT</button>
    <button id="cancelBtn" class="btn secondary">CANCEL</button>
    <div id="saveMsg" class="muted"></div>
  </div>
  <!-- WENIK PARTNER GIFTS UI -->
  <div class="card" id="giftsCard">
    <div class="eyebrow">WENIK GIFTS</div><h2>My Gifts</h2>
    <div class="muted">Optional. Add as many gifts as you want. Every new or edited gift needs WENIK Admin approval.</div>
    <input id="giftName" class="field" placeholder="Gift name">
    <input id="giftDescription" class="field" placeholder="Short description (optional)">
    <button id="addGiftBtn" class="btn">+ ADD GIFT</button>
    <div id="giftMsg" class="muted"></div>
    <div id="giftList"></div>
  </div>
  <button id="logoutBtn" class="btn secondary">LOG OUT</button>
</section>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const U='https://zkrnzwnbdoaqanqzznlw.supabase.co',K='sb_publishable_Q8pOXn-3YAUo_6OX6c2bKg_mLKH8O0k';
const sb=createClient(U,K),$=id=>document.getElementById(id);let stream,token,scanning=false;
function ph(v){let d=v.replace(/\D/g,'');if(d.startsWith('961'))return'+'+d;if(d.startsWith('0'))d=d.slice(1);return'+961'+d}
async function rpc(n,a={}){const{data,error}=await sb.rpc(n,a);if(error)throw error;return data}
async function start(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return showLogin();
  try{const p=await rpc('partner_my_profile');if(!p?.length)throw Error('This account is not a partner.');$('business').textContent=p[0].business_name;$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadGifts()}
  catch(e){await sb.auth.signOut();showLogin(e.message)}
}
function showLogin(m=''){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=m}
$('loginBtn').onclick=async()=>{try{$('loginMsg').textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({phone:ph($('phone').value),password:$('password').value});if(error)throw error;await start()}catch(e){$('loginMsg').textContent=e.message}};
function stopCamera(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camera').srcObject=null}
function qrUuid(raw){const s=String(raw||'').trim();const m=s.match(/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/i);return m?.[0]||''}
async function found(raw){const q=qrUuid(raw);if(!q)return;$('scanMsg').textContent='Checking QR…';stopCamera();try{const d=await rpc('partner_lookup_customer_by_qr_v3',{p_qr_token:q});if(!d?.length)throw Error('QR expired or invalid. Ask the customer to refresh it.');token=q;const x=d[0];$('customer').innerHTML='<b>'+x.first_name+'</b><br>WENIK ID: '+x.wenik_id+'<br>Benefit: '+(x.benefit_title||'None');$('scanCard').classList.add('hidden');$('customerCard').classList.remove('hidden');$('amount').focus()}catch(e){$('scanMsg').className='error';$('scanMsg').textContent=e.message}}
$('scanBtn').onclick=async()=>{try{if(!('BarcodeDetector'in window))throw Error('QR camera is not supported by this browser. Open this page in Chrome.');const detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('camera').srcObject=stream;await $('camera').play();scanning=true;$('scanMsg').className='muted';$('scanMsg').textContent='Point the camera at the customer QR.';const loop=async()=>{if(!scanning)return;try{const codes=await detector.detect($('camera'));if(codes[0])return found(codes[0].rawValue)}catch{}requestAnimationFrame(loop)};loop()}catch(e){stopCamera();$('scanMsg').className='error';$('scanMsg').textContent=e.message}};
$('saveBtn').onclick=async()=>{const amount=Number($('amount').value);if(!(amount>0))return $('saveMsg').textContent='Enter the bill amount.';try{$('saveBtn').disabled=true;$('saveMsg').className='muted';$('saveMsg').textContent='Recording…';const key=crypto.randomUUID();const d=await rpc('partner_record_transaction_v6',{p_qr_token:token,p_original_amount:amount,p_idempotency_key:key,p_notes:'Partner QR scan'});const x=d?.[0];$('saveMsg').className='success';$('saveMsg').textContent='Visit recorded successfully. Final amount: $'+Number(x?.final_amount||0).toFixed(2);$('amount').disabled=true;$('cancelBtn').textContent='SCAN ANOTHER'}catch(e){$('saveMsg').className='error';$('saveMsg').textContent=e.message}finally{$('saveBtn').disabled=false}};
$('cancelBtn').onclick=()=>{token='';$('amount').value='';$('amount').disabled=false;$('saveMsg').textContent='';$('customerCard').classList.add('hidden');$('scanCard').classList.remove('hidden');$('cancelBtn').textContent='CANCEL'};

function giftEsc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function loadGifts(){
  try{const list=await rpc('partner_my_gifts');$('giftList').innerHTML=(list||[]).map(g=>'<div class="card"><div><b>'+giftEsc(g.name)+'</b><div class="muted">'+giftEsc(g.description||'')+'</div><div class="muted">Status: '+giftEsc(String(g.approval_status||'pending').toUpperCase())+'</div></div><div class="actions"><button class="btn secondary" data-edit-gift="'+g.id+'" data-name="'+giftEsc(g.name)+'" data-description="'+giftEsc(g.description||'')+'">EDIT</button>'+(g.approval_status==='approved'?'':'<button class="btn secondary" data-delete-gift="'+g.id+'">DELETE</button>')+'</div></div>').join('')||'<div class="muted" style="margin-top:16px">No gifts added yet.</div>';document.querySelectorAll('[data-delete-gift]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this gift?'))return;try{await rpc('partner_delete_gift',{p_gift_id:b.dataset.deleteGift});await loadGifts()}catch(e){$('giftMsg').className='error';$('giftMsg').textContent=e.message}});document.querySelectorAll('[data-edit-gift]').forEach(b=>b.onclick=async()=>{const name=prompt('Gift name:',b.dataset.name||'');if(name===null)return;const description=prompt('Short description (optional):',b.dataset.description||'');if(description===null)return;try{await rpc('partner_update_gift',{p_gift_id:b.dataset.editGift,p_name:name.trim(),p_description:description.trim()||null});$('giftMsg').className='success';$('giftMsg').textContent='Gift updated and sent back for Admin approval.';await loadGifts()}catch(e){$('giftMsg').className='error';$('giftMsg').textContent=e.message}})}catch(e){$('giftMsg').className='error';$('giftMsg').textContent=e.message}}
$('addGiftBtn').onclick=async()=>{try{const name=$('giftName').value.trim(),description=$('giftDescription').value.trim();if(!name)throw Error('Enter the gift name.');$('addGiftBtn').disabled=true;$('giftMsg').className='muted';$('giftMsg').textContent='Submitting for approval…';await rpc('partner_submit_gift',{p_name:name,p_description:description||null});$('giftName').value='';$('giftDescription').value='';$('giftMsg').className='success';$('giftMsg').textContent='Gift submitted. Waiting for Admin approval.';await loadGifts()}catch(e){$('giftMsg').className='error';$('giftMsg').textContent=e.message}finally{$('addGiftBtn').disabled=false}};
$('logoutBtn').onclick=async()=>{stopCamera();await sb.auth.signOut();showLogin()};addEventListener('pagehide',stopCamera);start();
</script></main></body></html>
