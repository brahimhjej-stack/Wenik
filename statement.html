<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><title>WENIK Statement</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090713;color:#fff;font:14px Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.brand{font-size:30px;font-weight:1000;letter-spacing:2px}.sub{color:#ef159d;font-weight:900;letter-spacing:2px}.card{background:#fff;color:#15131a;border-radius:24px;padding:28px;box-shadow:0 22px 60px rgba(0,0,0,.35)}h1,h2,h3{margin:4px 0 10px}.muted{color:#696473}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:20px 0}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.box{border:1px solid #e8e4ed;border-radius:16px;padding:14px}.box strong{display:block;font-size:22px;margin-top:4px}.accent{background:linear-gradient(100deg,#8f24ff,#ef159d,#ff6f21,#ffd21c);color:#fff;border:0}.tableWrap{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #ece8f0}th{font-size:12px;color:#6d6674}.num{text-align:right}.total{font-size:25px;font-weight:1000}.actions{display:flex;gap:10px;margin:16px 0}.btn{border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(100deg,#8f24ff,#ef159d,#ff6f21);color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.btn.secondary{background:#282431}.error{color:#ff8a9f}.status{font-weight:900;text-transform:uppercase}.foot{margin-top:24px;padding-top:16px;border-top:1px solid #ece8f0;color:#77717e;font-size:12px;line-height:1.5}@media(max-width:600px){.wrap{padding:12px}.card{padding:18px;border-radius:18px}.meta,.summary{grid-template-columns:1fr}.top{display:block}.actions{flex-direction:column}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.actions,.screenOnly{display:none!important}.card{box-shadow:none;border-radius:0;padding:0}.brand{color:#111}.sub{color:#8f24ff}}
</style></head><body><div class="wrap">
<div class="top screenOnly"><div><div class="brand">WENIK</div><div class="sub">OFFICIAL MONTHLY STATEMENT</div></div><div class="actions"><button class="btn" onclick="window.print()">PRINT / SAVE PDF</button><a class="btn secondary" href="javascript:history.back()">BACK</a></div></div>
<div id="loading" class="screenOnly">Loading official statement…</div><div id="error" class="error screenOnly"></div>
<article id="invoice" class="card" hidden></article>
</div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zkrnzwnbdoaqanqzznlw.supabase.co','sb_publishable_Q8pOXn-3YAUo_6OX6c2bKg_mLKH8O0k');
const money=n=>'$'+Number(n||0).toFixed(2),esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])),dt=v=>v?new Date(v).toLocaleString('en-GB',{timeZone:'Asia/Beirut',dateStyle:'short',timeStyle:'short'}):'';
async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('Statement ID is missing.');const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please log in first.');const{data,error}=await sb.rpc('partner_statement_detail',{p_statement_id:id});if(error)throw error;if(!data?.statement)throw Error('Statement not found.');const s=data.statement,lines=data.lines||[],adjustments=data.adjustments||[],payments=data.payments||[];const rate=(Number(s.sales_fee_rate||0)*100).toFixed(2).replace(/\.00$/,'');document.title='WENIK '+s.invoice_no;document.getElementById('loading').hidden=true;const el=document.getElementById('invoice');el.hidden=false;el.innerHTML=`<div class="top"><div><div class="brand" style="color:#111">WENIK</div><div class="sub">MONTHLY PARTNER STATEMENT</div></div><div style="text-align:right"><h2>${esc(s.invoice_no)}</h2><div class="muted">Issued ${dt(s.issued_at)}</div><div class="status">${esc(s.status)}</div></div></div><div class="meta"><div><b>Billed to</b><div>${esc(s.business_name)}</div><div class="muted">${esc(s.address||'')}</div><div class="muted">${esc(s.phone||'')}</div></div><div><b>Billing period</b><div>${esc(s.period_start)} → ${esc(s.period_end)}</div><div class="muted">Due date: ${esc(s.due_date)}</div><div class="muted">Currency: ${esc(s.currency||'USD')}</div></div></div><div class="summary"><div class="box"><span class="muted">Original WENIK sales</span><strong>${money(s.original_sales_total)}</strong><div class="muted">Before customer benefits</div></div><div class="box"><span class="muted">${rate}% exact fee</span><strong>${money(s.sales_fee_exact)}</strong><div class="muted">Fraction waived: ${money(s.sales_fee_fraction_waived)}</div></div><div class="box"><span class="muted">WENIK fee charged</span><strong>${money(s.sales_fee_charged)}</strong><div class="muted">Whole-dollar floor in Partner's favor</div></div><div class="box"><span class="muted">Monthly subscription</span><strong>${money(s.monthly_subscription)}</strong></div><div class="box"><span class="muted">Adjustments</span><strong>${money(s.adjustments_total)}</strong></div><div class="box accent"><span>Total amount due</span><strong>${money(s.total_due)}</strong><div>Paid: ${money(s.paid_amount)}</div></div></div><h3>Transactions included (${Number(s.transaction_count||0)})</h3><div class="tableWrap"><table><thead><tr><th>Date / Time</th><th>WENIK ID</th><th class="num">Original bill</th><th class="num">Customer benefit</th><th class="num">Final paid</th></tr></thead><tbody>${lines.length?lines.map(x=>`<tr><td>${esc(dt(x.transaction_at))}</td><td>${esc(x.customer_wenik_id||'—')}</td><td class="num">${money(x.original_amount)}</td><td class="num">${money(x.benefit_amount)}</td><td class="num">${money(x.final_amount)}</td></tr>`).join(''):`<tr><td colspan="5" class="muted">No confirmed transactions in this period.</td></tr>`}</tbody></table></div>${adjustments.length?`<h3 style="margin-top:24px">Adjustments</h3><div class="tableWrap"><table><thead><tr><th>Date</th><th>Reason</th><th class="num">Amount</th></tr></thead><tbody>${adjustments.map(a=>`<tr><td>${esc(dt(a.created_at))}</td><td>${esc(a.reason)}</td><td class="num">${money(a.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}${payments.length?`<h3 style="margin-top:24px">Payments</h3><div class="tableWrap"><table><thead><tr><th>Date</th><th>Method</th><th>Reference</th><th class="num">Amount</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${esc(dt(p.paid_at))}</td><td>${esc(p.payment_method)}</td><td>${esc(p.provider_reference||'—')}</td><td class="num">${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="foot">WENIK calculates the sales fee from the monthly total of original confirmed bill values before customer benefits. The exact percentage is shown for transparency; any decimal fraction of the WENIK sales fee is waived in the Partner's favor before the monthly subscription is added. Closed statements are preserved as an accounting snapshot; later corrections appear as visible adjustments.</div>`}catch(e){document.getElementById('loading').hidden=true;document.getElementById('error').textContent=e.message||'Unable to load statement.'}}
load();
</script></body></html>
