<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WENIK · Payment settings</title><style>body{font:17px system-ui;background:#140920;color:white;max-width:520px;margin:40px auto;padding:24px}input,button{display:block;width:100%;padding:12px;box-sizing:border-box;margin:8px 0 24px}button{background:#ffbf38;border:0;border-radius:10px;font:inherit}#form{display:none}a{color:#ffbf38}</style></head><body><h1>Whish payment settings</h1><p id="status">Checking access…</p><form id="form"><label>Customer monthly fee (USD)<input id="customer" type="number" min="1" max="10000" step=".01" required></label><label>Partner monthly fee (USD)<input id="partner" type="number" min="1" max="10000" step=".01" required></label><label>Free months for new partners<input id="trial" type="number" min="0" max="12" step="1" value="3" required></label><label>Enable sandbox checkout<input id="enabled" type="checkbox"></label><label>Require active memberships for new purchases<input id="enforcement" type="checkbox"></label><p>Changes apply to new payment requests. Existing quoted amounts and trial dates remain unchanged. Automatic debit is unavailable.</p><button>Save settings</button></form><a href="whish-refunds.html">Review verified refunds</a><br><a href="admin-billing.html">Back to billing</a><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const configResponse=await fetch('/api/whish/config');if(!configResponse.ok)throw Error('Payment settings are not configured yet.');const config=await configResponse.json();const sb=createClient(config.supabaseUrl,config.publishableKey);const $=id=>document.getElementById(id);async function rpc(n,args={}){const{data,error}=await sb.rpc(n,args);if(error)throw error;return data;}
try{const p=await rpc('admin_my_profile');if(p?.[0]?.role!=='super_admin')throw Error('Super Admin access required.');const s=(await rpc('admin_billing_settings'))?.[0];const paymentSettings=await rpc('whish_admin_settings');$('enabled').checked=paymentSettings.enabled;$('enforcement').checked=paymentSettings.enforce_member_access===true;$('trial').value=paymentSettings.partner_trial_months;$('customer').value=s.customer_monthly_fee;$('partner').value=s.partner_monthly_fee;$('status').textContent='Only the active Super Admin can change these settings.';$('form').style.display='block';}catch(e){$('status').textContent=e.message;}
$('form').onsubmit=async e=>{e.preventDefault();if(!confirm('Save these payment settings?'))return;try{await rpc('whish_save_settings',{p_customer_fee:Number($('customer').value),p_partner_fee:Number($('partner').value),p_enabled:$('enabled').checked,p_trial_months:Number($('trial').value),p_enforce_membership:$('enforcement').checked});$('status').textContent='Payment settings saved.';}catch(e){$('status').textContent=e.message;}};
</script></body></html>
