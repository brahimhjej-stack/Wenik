<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WENIK · Refund reviews</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#140920;color:white;max-width:680px;margin:30px auto;padding:20px}.card{border:1px solid #744689;border-radius:18px;padding:20px;margin:20px 0}input,select,textarea,button{font:inherit;width:100%;padding:12px;border-radius:10px;margin:8px 0 16px}button{background:#ffc03a;border:0}p{line-height:1.5;color:#d5c6de}a{color:#ffc03a}[hidden]{display:none!important}</style></head><body><h1>Verified refund reviews</h1><p>Review the invoice and any later payments before changing membership access. This page records an access decision; it does not send money or reverse invoice payments. Record any required accounting adjustment separately.</p><p id="status" role="status">Checking access…</p><div id="list"></div><a href="whish-settings.html">Back to payment settings</a><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const status=document.getElementById('status'),list=document.getElementById('list');
let sb;
async function rpc(name,args={}){const{data,error}=await sb.rpc(name,args);if(error)throw Error(error.message||'Unable to complete review.');return data;}
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
async function load(){const rows=await rpc('whish_admin_refund_reviews');list.replaceChildren();const open=(rows||[]).filter(r=>r.status==='open');status.textContent=open.length?open.length+' refund review(s) require attention.':'No open refund reviews.';
for(const row of open){const card=element('section');card.className='card';card.append(element('h2',row.kind+' · '+Number(row.amount).toFixed(2)+' '+row.currency),element('p',row.environment.toUpperCase()+' · '+(row.invoice_no||row.order_id)),element('p','Current paid until: '+(row.paid_until?new Date(row.paid_until).toLocaleString():'None')));
const form=element('form'),label=element('label','Membership decision'),resolution=element('select');for(const[value,title]of [['keep_access','Keep current membership access'],['set_paid_until','Set a reviewed expiry date']]){const option=element('option',title);option.value=value;resolution.append(option);}label.append(resolution);
const dateLabel=element('label','Reviewed expiry date'),date=element('input');date.type='datetime-local';dateLabel.hidden=true;dateLabel.append(date);resolution.onchange=()=>{dateLabel.hidden=resolution.value!=='set_paid_until';date.required=!dateLabel.hidden;};
const noteLabel=element('label','Review note (include accounting action and later payments checked)'),note=element('textarea');note.required=true;note.minLength=5;note.maxLength=2000;noteLabel.append(note);const submit=element('button','Save reviewed decision');submit.type='submit';const message=element('p');message.setAttribute('role','status');form.append(label,dateLabel,noteLabel,submit,message);card.append(form);list.append(card);
form.onsubmit=async event=>{event.preventDefault();try{let paidUntil=null;if(resolution.value==='set_paid_until'){if(row.environment!=='production')throw Error('Sandbox reviews cannot alter real membership.');const parsed=new Date(date.value);if(!Number.isFinite(parsed.getTime()))throw Error('Choose a valid expiry date.');paidUntil=parsed.toISOString();}if(!confirm('Save this membership decision for '+row.order_id+'?'))return;submit.disabled=true;await rpc('whish_resolve_refund_review',{p_order:row.order_id,p_resolution:resolution.value,p_note:note.value,p_paid_until:paidUntil});await load();}catch(e){message.textContent=e.message;}finally{submit.disabled=false;}};
}}
try{const response=await fetch('/api/whish/config');if(!response.ok)throw Error('Payment settings are not configured yet.');const config=await response.json();sb=createClient(config.supabaseUrl,config.publishableKey);await load();}catch(e){status.textContent=e.message;}
</script></body></html>
