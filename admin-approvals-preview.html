<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><title>WENIK · Approvals Preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -5%,rgba(143,36,255,.28),transparent 30%),radial-gradient(circle at 92% 2%,rgba(255,111,33,.20),transparent 27%),linear-gradient(180deg,#070610,#090713 48%,#06050d);color:#fff;font:15px Arial,sans-serif;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:18px 14px 80px}.brand{font-weight:1000;font-size:26px;letter-spacing:2px}.sub{color:#ff9cdc;font-weight:900;letter-spacing:3px;font-size:11px}.card{background:linear-gradient(145deg,rgba(28,16,51,.96),rgba(12,11,23,.96));border:1px solid rgba(178,92,255,.24);border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 14px 38px rgba(0,0,0,.28)}.field,.btn{width:100%;border-radius:16px;border:1px solid rgba(178,92,255,.26);background:#0d0b16;color:#fff;padding:14px 15px;font-size:15px;margin-top:10px}.btn{border:0;font-weight:900;background:linear-gradient(100deg,#8f24ff,#ef159d 40%,#ff6f21 74%,#ffd21c)}.secondary{background:#21192f;border:1px solid rgba(143,36,255,.35)}.ok{background:linear-gradient(90deg,#5b21d6,#8f24ff,#ef159d)}.danger{background:linear-gradient(90deg,#b91c57,#ef445f)}.hidden{display:none!important}.muted{color:#b9b4c8}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{padding:6px 10px;border-radius:999px;background:#241732;color:#ffd9ee;font-size:12px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.approvalImg{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:18px;margin-top:14px;background:#05040a;border:1px solid rgba(178,92,255,.22);cursor:zoom-in}.hint{text-align:center;color:#b9b4c8;font-size:12px;margin-top:8px}.viewer{position:fixed;inset:0;background:rgba(2,1,8,.94);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px}.viewerBox{width:min(980px,100%);max-height:96vh;overflow:auto;background:#0d0b16;border:1px solid rgba(178,92,255,.4);border-radius:24px;padding:14px}.viewerTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.viewerClose{width:auto;margin:0}.viewer img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#05040a;border-radius:18px;margin-top:12px}.status{margin-top:10px;color:#ff93a8}.good{color:#79f1c6}@media(max-width:520px){.wrap{padding:14px 12px 70px}.row{align-items:flex-start}.approvalImg{max-height:300px}}</style></head><body><div class="wrap"><div class="brand">WENIK</div><div class="sub">ADMIN · APPROVALS PREVIEW</div><section id="login" class="card"><h1>Admin Login</h1><input id="email" class="field" type="email" placeholder="Admin email" autocomplete="username"><input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="btn">LOGIN</button><div id="loginMsg" class="status"></div></section><section id="app" class="hidden"><div class="card"><div class="row"><div><h2 style="margin:0 0 8px">Pending Partner Images</h2><div class="muted">Only uploaded images waiting for Admin approval.</div></div><button id="refreshBtn" class="btn secondary" style="width:auto;margin:0">REFRESH</button></div></div><div id="list"></div></section></div><div id="viewer" class="viewer hidden"><div class="viewerBox"><div class="viewerTop"><div><b id="viewerBusiness">Partner image</b><div id="viewerMeta" class="muted"></div></div><button id="closeBtn" class="btn secondary viewerClose">CLOSE ✕</button></div><img id="viewerImg" alt="Partner image"><div class="actions"><button id="approveBtn" class="btn ok">APPROVE</button><button id="rejectBtn" class="btn danger">REJECT</button></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://zkrnzwnbdoaqanqzznlw.supabase.co','sb_publishable_Q8pOXn-3YAUo_6OX6c2bKg_mLKH8O0k',{auth:{storageKey:'wenik-admin-auth'}}),$=id=>document.getElementById(id);let current=null;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function rpc(n,a={}){const{data,error}=await sb.rpc(n,a);if(error)throw error;return data}async function start(){const{data:{session}}=await sb.auth.getSession();if(!session)return;try{const p=await rpc('admin_my_profile');if(!p?.length)throw Error('Not authorized');$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}async function load(){try{const rows=await rpc('admin_pending_ads'),ads=(rows||[]).filter(a=>String(a.image_url||'').trim());$('list').innerHTML=ads.map(a=>'<div class="card"><div class="row"><div><b>'+esc(a.business_name)+'</b><div class="muted">Image '+esc(a.slot_no)+'</div></div><span class="pill">PENDING</span></div><img class="approvalImg" src="'+esc(a.image_url)+'" loading="lazy" decoding="async" data-id="'+esc(a.id)+'" data-business="'+esc(a.business_name||'')+'" data-slot="'+esc(a.slot_no)+'"><div class="hint">Tap image to view it full size before approval</div><div class="actions"><button class="btn ok directApprove" data-id="'+esc(a.id)+'">APPROVE</button><button class="btn danger directReject" data-id="'+esc(a.id)+'">REJECT</button></div></div>').join('')||'<div class="card muted">No pending uploaded images.</div>';document.querySelectorAll('.approvalImg').forEach(img=>img.onclick=()=>openViewer(img));document.querySelectorAll('.directApprove').forEach(b=>b.onclick=()=>review(b.dataset.id,'approved'));document.querySelectorAll('.directReject').forEach(b=>b.onclick=()=>review(b.dataset.id,'rejected'))}catch(e){$('list').innerHTML='<div class="card status">'+esc(e.message)+'</div>'}}function openViewer(img){current={id:img.dataset.id};$('viewerBusiness').textContent=img.dataset.business||'Partner image';$('viewerMeta').textContent='Image '+img.dataset.slot+' · PENDING';$('viewerImg').src=img.src;$('viewer').classList.remove('hidden')}function closeViewer(){$('viewer').classList.add('hidden');$('viewerImg').removeAttribute('src');current=null}async function review(id,status){let note='';if(status==='rejected'){note=prompt('Reason for rejection:')||'';if(!note)return}try{await rpc('admin_review_partner_ad',{p_ad_id:id,p_status:status,p_note:note});closeViewer();await load()}catch(e){alert(e.message)}}$('loginBtn').onclick=async()=>{try{$('loginMsg').textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await start()}catch(e){$('loginMsg').textContent=e.message}};$('refreshBtn').onclick=load;$('closeBtn').onclick=closeViewer;$('viewer').onclick=e=>{if(e.target===$('viewer'))closeViewer()};$('approveBtn').onclick=()=>current&&review(current.id,'approved');$('rejectBtn').onclick=()=>current&&review(current.id,'rejected');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});start();</script></body></html>
