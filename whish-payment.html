<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WENIK · Whish payment</title><style>body{background:#140920;color:white;font:18px system-ui;max-width:560px;margin:50px auto;padding:24px}button,select{font:inherit;padding:14px;border-radius:12px;margin:12px 0;width:100%}button{background:#ffc03a;color:#180920;border:0;cursor:pointer}small{color:#c8b9d2}a{color:#ffc03a}</style></head><body><h1>WENIK · Whish Pay</h1><p id="mode">Sandbox testing. No real subscription will be activated.</p><label for="kind">Subscription</label><select id="kind"><option value="customer">Customer</option><option value="partner">Partner</option></select><button id="pay">Get payment amount</button><p id="message" role="status"></p><small>Each payment requires confirmation in Whish. Automatic monthly debit is not available yet.</small><p><a href="/">Back to WENIK</a></p><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const sb=createClient('https://zkrnzwnbdoaqanqzznlw.supabase.co','sb_publishable_Q8pOXn-3YAUo_6OX6c2bKg_mLKH8O0k');
const button=document.getElementById('pay'),message=document.getElementById('message');let payment=null;
async function api(path,options={}){const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please sign in to WENIK first.');const r=await fetch('/api/whish/'+path,{...options,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to process payment');return d;}
button.onclick=async()=>{try{if(payment){location.assign(payment.collectUrl);return;}button.disabled=true;const d=await api('create',{method:'POST',body:JSON.stringify({kind:document.getElementById('kind').value})});if(d.trial){message.textContent='Your free trial ends '+new Date(d.trialEndsAt).toLocaleDateString()+'. No payment is needed now.';return;}payment=d;message.textContent='Confirm '+Number(d.amount).toFixed(2)+' '+d.currency+' for one month. This is a sandbox test.';button.textContent='Continue to Whish';}catch(e){message.textContent=e.message;}finally{button.disabled=false;}};
document.getElementById('kind').onchange=()=>{payment=null;button.textContent='Get payment amount';message.textContent='';};
const order=new URL(location.href).searchParams.get('order');if(order){let attempts=0;button.hidden=true;async function poll(){try{const d=await api('status?externalId='+encodeURIComponent(order));message.textContent=d.state==='success'?'Test payment confirmed. Your real subscription is unchanged.':d.state==='failed'?'The payment link has expired unpaid.':d.state==='refunded'?'Payment refunded.':'Payment is being verified. Please wait.';if(['pending','unknown'].includes(d.state)&&++attempts<12)setTimeout(poll,5000);}catch(e){message.textContent=e.message;}}poll();}
</script></body></html>
