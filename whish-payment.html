<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WENIK · Whish payment</title><style>body{background:#140920;color:white;font:18px system-ui;max-width:560px;margin:50px auto;padding:24px}input,button,select{font:inherit;padding:14px;border-radius:12px;margin:12px 0;width:100%}button{background:#ffc03a;color:#180920;border:0;cursor:pointer}small{color:#c8b9d2}a{color:#ffc03a}</style></head><body><h1>WENIK · Whish Pay</h1><p id="mode">Sandbox testing. No real subscription will be activated.</p><form id="login" hidden><p id="loginHelp">Sign in with an account from WENIK Readiness Test.</p><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="signIn" type="submit">Sign in</button></form><p id="account" role="status"></p><button id="signOut" hidden>Sign out</button><label for="kind">Subscription</label><select id="kind"><option value="customer">Customer</option><option value="partner">Partner</option></select><label id="statementLabel" for="statement" hidden>Monthly statement</label><select id="statement" hidden></select><button id="pay">Get payment amount</button><p id="message" role="status"></p><small>Each payment requires confirmation in Whish. Automatic monthly debit is not available yet.</small><p><a href="/">Back to WENIK</a></p><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const configResponse=await fetch('/api/whish/config');
if(!configResponse.ok){document.getElementById('message').textContent='Payment page is not configured yet.';document.getElementById('pay').disabled=true;throw Error('Missing payment configuration');}
const config=await configResponse.json();
const sb=createClient(config.supabaseUrl,config.publishableKey);
const sandbox=config.environment==='sandbox';if(!sandbox)document.getElementById('loginHelp').textContent='Sign in to your WENIK account.';document.getElementById('mode').textContent=sandbox?'Sandbox testing. No real subscription will be activated.':'Pay securely with Whish. Review the amount before confirming your payment.';
const button=document.getElementById('pay'),message=document.getElementById('message');let payment=null,pollActive=true;
const login=document.getElementById('login'),account=document.getElementById('account'),signOut=document.getElementById('signOut');
async function syncSession(){const{data:{session}}=await sb.auth.getSession();login.hidden=!!session;signOut.hidden=!session;button.disabled=!session||!config.checkoutEnabled;account.textContent=!config.checkoutEnabled?'Payments are not available yet.':session?(sandbox?'Test account signed in.':'Signed in.'):'Sign in to continue.';payment=null;button.textContent='Get payment amount';}
login.onsubmit=async event=>{event.preventDefault();const submit=document.getElementById('signIn');submit.disabled=true;try{const{error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('password').value='';if(error)throw Error('Unable to sign in. Use an account from the test project.');await syncSession();message.textContent='';}catch(e){message.textContent=e.message;}finally{submit.disabled=false;}};
signOut.onclick=async()=>{const{error}=await sb.auth.signOut();if(error){message.textContent='Unable to sign out. Try again.';return;}statement.replaceChildren();await syncSession();};
await syncSession();
const statement=document.getElementById('statement'),statementLabel=document.getElementById('statementLabel');
async function loadStatements(){const{data,error}=await sb.rpc('partner_my_monthly_statements');if(error)throw Error('Unable to load statements. Please sign in as partner manager.');statement.replaceChildren();for(const row of data||[]){const due=Number(row.total_due)-Number(row.paid_amount);if(row.status==='void'||due<1)continue;const option=document.createElement('option');option.value=row.statement_id;option.textContent=row.invoice_no+' · subscription $'+Number(row.monthly_subscription).toFixed(2)+' + sales fee $'+Number(row.sales_fee_charged).toFixed(2)+' · balance $'+due.toFixed(2);statement.append(option);}if(!statement.options.length)message.textContent='No payable monthly statement. The 1% sales fee applies during the free subscription trial too.';}

async function api(path,options={}){const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please sign in to WENIK first.');const r=await fetch('/api/whish/'+path,{...options,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to process payment');return d;}
button.onclick=async()=>{try{if(payment){location.assign(payment.collectUrl);return;}button.disabled=true;const d=await api('create',{method:'POST',body:JSON.stringify({kind:document.getElementById('kind').value,statementId:statement.value||undefined})});if(d.state==='success'){message.textContent='Test payment already confirmed. Your real subscription is unchanged.';return;}if(d.trial){message.textContent='Your free trial ends '+new Date(d.trialEndsAt).toLocaleDateString()+'. No payment is needed now.';return;}payment=d;message.textContent='Confirm '+Number(d.amount).toFixed(2)+' '+d.currency+(document.getElementById('kind').value==='partner'?' for the selected monthly statement.':' for one month.')+(sandbox?' This is a sandbox test.':' This is a one-time payment; it will not renew automatically.');button.textContent='Continue to Whish';}catch(e){message.textContent=e.message;}finally{button.disabled=false;}};
document.getElementById('kind').onchange=async()=>{pollActive=false;const clean=new URL(location.href);clean.searchParams.delete('order');history.replaceState(null,'',clean);button.hidden=false;payment=null;button.textContent='Get payment amount';message.textContent='';const partner=document.getElementById('kind').value==='partner';statement.hidden=statementLabel.hidden=!partner;if(partner){try{await loadStatements();}catch(e){message.textContent=e.message;}}};
statement.onchange=()=>{payment=null;button.textContent='Get payment amount';message.textContent='';};
const order=new URL(location.href).searchParams.get('order');if(order){let attempts=0;button.hidden=true;async function poll(){if(!pollActive)return;try{const d=await api('status?externalId='+encodeURIComponent(order));if(!pollActive)return;if(d.kind){document.getElementById('kind').value=d.kind;}message.textContent=d.state==='success'?(sandbox?'Test payment confirmed: ':'Payment confirmed: ')+Number(d.amount).toFixed(2)+' '+d.currency+(d.invoiceNo?' · '+d.invoiceNo:'')+(sandbox?'. Your real subscription is unchanged.':''):d.state==='failed'?'The payment link has expired unpaid.':d.state==='refunded'?'Payment refunded.':'Payment is being verified. Please wait.';if(['pending','unknown'].includes(d.state)&&++attempts<12)setTimeout(poll,5000);}catch(e){message.textContent=e.message;}}poll();}
if(!order&&new URL(location.href).searchParams.get('kind')==='partner'){document.getElementById('kind').value='partner';await document.getElementById('kind').onchange();const requested=new URL(location.href).searchParams.get('statement');if(requested&&Array.from(statement.options).some(x=>x.value===requested))statement.value=requested;}
</script></body></html>
