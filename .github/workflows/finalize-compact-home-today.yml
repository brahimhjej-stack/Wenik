name: Finalize compact WENIK home
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'scripts/finalize_compact_home_today.py'
      - '.github/workflows/finalize-compact-home-today.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: staging, fetch-depth: 0}
      - run: sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - run: python scripts/finalize_compact_home_today.py
      - name: Verify customer-only safe change
        run: |
          sha256sum -c /tmp/protected.sha
          git diff --exit-code -- admin.html partner.html sw.js
          test "$(git diff --name-only | sort)" = "index.html"
          grep -q 'WENIK COMPACT HOME + MINI DASH V1' index.html
          grep -q '76 468 506' index.html
          grep -q 'CATEGORIES' index.html
          grep -q 'setInterval(()=>show(n+1),3000)' index.html
      - name: Commit staging preview
        run: |
          git config user.name 'wenik-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize compact WENIK home on staging'
          git push origin staging
