name: Password eye all preview

on:
  push:
    branches:
      - password-eye-all-preview-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: password-eye-all-preview-20260906
          fetch-depth: 0
      - name: Add global password show/hide controls
        env:
          PASSWORD_BLOCK_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          files = [Path('index.html'), Path('partner.html'), Path('admin.html')]
          marker = '<!-- WENIK GLOBAL PASSWORD VISIBILITY V1 -->'
          block = base64.b64decode(os.environ['PASSWORD_BLOCK_B64']).decode('utf-8')
          for path in files:
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</body>' not in text:
                  raise SystemExit(f'Missing </body> in {path}')
              text = text.replace('</body>', block + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit preview patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html partner.html admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add password visibility toggle everywhere"
          git push origin HEAD:password-eye-all-preview-20260906
