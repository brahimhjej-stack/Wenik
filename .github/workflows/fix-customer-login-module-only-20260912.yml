name: Fix customer login module only
on:
  push:
    paths:
      - 'scripts/fix_customer_login_module_only_20260912.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch only index.html
        run: python scripts/fix_customer_login_module_only_20260912.py
      - name: Verify only index.html changed
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
      - name: Commit
        run: |
          git config user.name "WENIK automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix customer login module initialization only"
          git push origin main
