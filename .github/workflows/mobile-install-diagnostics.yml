name: WENIK installation diagnostics
on:
  push:
    branches: [diagnostics/android-install-20261031]
permissions:
  contents: read
jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read completed APK build metadata
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27.2.0 build:view 787995a0-ab27-4cf6-bf9e-1a1993d65623 --json > "$RUNNER_TEMP/wenik-build.json"
      - name: Download and inspect installation package
        shell: python
        run: |
          import os,json,urllib.request,pathlib,zipfile,subprocess,re,hashlib
          metadata=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'wenik-build.json').read_text())
          artifacts=metadata.get('artifacts') or {}
          url=artifacts.get('buildUrl') or artifacts.get('applicationArchiveUrl')
          if not url: raise RuntimeError('Completed build has no APK artifact')
          folder=pathlib.Path('install-diagnostics');folder.mkdir()
          apk=folder/'WENIK_Android_Membership_Update.apk'
          urllib.request.urlretrieve(url,apk)
          with zipfile.ZipFile(apk) as z:
            if z.testzip() is not None: raise RuntimeError('APK archive integrity failure')
          root=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools'
          versions=sorted(root.iterdir(),key=lambda p:tuple(int(x) for x in re.findall(r'\d+',p.name)))
          tools=versions[-1]
          badging=subprocess.run([str(tools/'aapt'),'dump','badging',str(apk)],capture_output=True,text=True,check=True).stdout
          cert=subprocess.run([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],capture_output=True,text=True,check=True).stdout
          expected='4760e4dbcd447bfeb097c1eefb6678bf6e696e312b77c913ee3fcf1e6901dadb'
          actual=re.search(r'certificate SHA-256 digest: ([0-9a-fA-F:]+)',cert).group(1).replace(':','').lower()
          report={'buildId':metadata.get('id'),'status':metadata.get('status'),'appVersion':metadata.get('appVersion'),'appBuildVersion':metadata.get('appBuildVersion'),'gitCommitHash':metadata.get('gitCommitHash'),'package':badging.splitlines()[0],'sdk':[l for l in badging.splitlines() if l.startswith(('sdkVersion:','targetSdkVersion:'))],'bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'certificateSha256':actual,'matchesPreviousProductionAabCertificate':actual==expected}
          (folder/'installation-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          print(cert)
      - uses: actions/upload-artifact@v4
        with:
          name: wenik-install-diagnostics
          path: install-diagnostics/
          retention-days: 14
