name: Fix Admin Dashboard Upload V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_admin_dashboard_upload_v2.py'
      - '.github/workflows/fix-admin-dashboard-upload-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply upload fix
        run: python scripts/fix_admin_dashboard_upload_v2.py
      - name: Verify protected files unchanged
        run: |
          git diff --exit-code -- index.html partner.html sw.js || (echo 'Protected runtime files changed' && exit 1)
          git diff --check
          grep -q 'WENIK ADMIN DASHBOARD UPLOAD FIX V2' admin.html
      - name: Commit Admin upload fix
        run: |
          if git diff --quiet -- admin.html; then echo 'No admin changes needed.'; exit 0; fi
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Fix Admin Dashboard image upload and compact mobile layout'
          git push
