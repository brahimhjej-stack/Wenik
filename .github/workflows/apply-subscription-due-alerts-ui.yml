name: Apply Subscription Due Alerts UI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-subscription-due-alerts-ui.py'
      - '.github/workflows/apply-subscription-due-alerts-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record protected hashes
        run: |
          sha256sum index.html > /tmp/index.sha
          [ -f partner.html ] && sha256sum partner.html > /tmp/partner.sha || true
          [ -f sw.js ] && sha256sum sw.js > /tmp/sw.sha || true
      - name: Apply guarded patch
        run: python scripts/add-subscription-due-alerts-ui.py
      - name: Verify protected files unchanged
        run: |
          sha256sum -c /tmp/index.sha
          [ -f /tmp/partner.sha ] && sha256sum -c /tmp/partner.sha || true
          [ -f /tmp/sw.sha ] && sha256sum -c /tmp/sw.sha || true
      - name: Verify only admin runtime changed
        run: |
          changed=$(git diff --name-only)
          echo "$changed"
          test "$changed" = "admin.html"
      - name: Commit runtime change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add subscription due alerts and suspension controls'
          git push
