name: Apply flexible WIN draw UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_flexible_win_draw.py'
      - '.github/workflows/apply-flexible-win-draw.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply flexible WIN draw UI
        run: python scripts/apply_flexible_win_draw.py
      - name: Verify only admin.html changed
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No changes needed"
            exit 0
          fi
          if [ "$changed" != "admin.html" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          grep -q 'WENIK FLEXIBLE WIN DRAW' admin.html
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add flexible winner count to WIN draws'
          git push
