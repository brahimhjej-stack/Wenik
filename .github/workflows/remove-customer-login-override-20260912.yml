name: Remove WENIK customer login override
on:
  push:
    paths:
      - 'scripts/remove_customer_login_override_20260912.py'
      - '.github/workflows/remove-customer-login-override-20260912.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove only customer login override
        run: python scripts/remove_customer_login_override_20260912.py
      - name: Verify only index changed
        run: |
          changed=$(git status --short | awk '{print $2}' | grep -v '^$' || true)
          test "$changed" = "index.html"
      - name: Commit
        run: |
          git config user.name "WENIK automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore original customer login flow only"
          git push origin main
