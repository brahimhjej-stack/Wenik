name: Remove abandoned customer social login
on:
  push:
    branches: [staging]
    paths:
      - 'scripts/remove_customer_social_login.py'
      - '.github/workflows/remove-customer-social-login.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Protect non-customer apps
        run: sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - name: Remove social login experiment
        run: python scripts/remove_customer_social_login.py
      - name: Verify protected files unchanged
        run: sha256sum -c /tmp/protected.sha
      - name: Verify only customer runtime changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          bad="$(echo "$changed" | grep -Ev '^index\.html$' || true)"
          test -z "$bad"
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove abandoned social login from staging customer UI'
          git push origin staging
