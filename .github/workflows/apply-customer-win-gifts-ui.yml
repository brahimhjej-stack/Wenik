name: Apply customer WIN gifts UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Protect non-customer runtime files
        run: |
          sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - name: Apply WIN gifts UI
        run: python scripts/apply_customer_win_gifts_ui.py
      - name: Verify safety
        run: |
          sha256sum -c /tmp/protected.sha
          git diff --exit-code -- admin.html partner.html sw.js
          test "$(git diff --name-only | sort)" = "index.html"
          grep -q 'WENIK WIN GIFTS UI V1' index.html
          grep -q 'public_active_win_gifts' index.html
          grep -q 'remaining_quantity' index.html
      - name: Commit staging preview
        run: |
          git config user.name 'wenik-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply customer WIN gifts UI on staging'
          git push origin staging
