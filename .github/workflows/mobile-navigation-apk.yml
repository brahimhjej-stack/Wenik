name: WENIK Partners Google Play bundle
on:
  push:
    branches: [fix/mobile-partner-full-page]
    paths: [.github/workflows/mobile-navigation-apk.yml]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Build AAB locally with existing Expo credentials
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/wenik-apk
        run: npx --yes eas-cli@27.2.0 build --platform android --profile production --local --non-interactive --freeze-credentials --output "$RUNNER_TEMP/WENIK-Partners-Update.aab"
      - name: Verify signed Android App Bundle
        run: |
          unzip -tq "$RUNNER_TEMP/WENIK-Partners-Update.aab"
          jarsigner -verify "$RUNNER_TEMP/WENIK-Partners-Update.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: WENIK-Partners-Play-AAB
          path: ${{ runner.temp }}/WENIK-Partners-Update.aab
          retention-days: 14

# Rebuild with optional portrait hardware support.
