name: Apply WENIK customer partner discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-partner-discovery.yml'
      - 'scripts/upgrade_customer_partner_discovery.py'
      - 'scripts/fix_partner_area_list_clarity.py'
      - 'scripts/upgrade_customer_partner_area_overlay.py'
      - 'scripts/fix_customer_partner_card_image_and_modal_area.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture protected hashes
        run: |
          sha256sum admin.html partner.html sw.js > /tmp/protected.sha256
      - name: Apply Customer Home + Partner discovery upgrade
        run: python3 scripts/upgrade_customer_partner_discovery.py
      - name: Apply clear Area list UI
        run: python3 scripts/fix_partner_area_list_clarity.py
      - name: Apply Area overlay upgrade
        run: python3 scripts/upgrade_customer_partner_area_overlay.py
      - name: Apply partner card image + modal area fix
        run: |
          if grep -q 'WENIK CUSTOMER PARTNER CARD IMAGE + MODAL AREA FIX V1' index.html; then
            echo 'Customer partner card image + modal area fix already applied'
          else
            python3 scripts/fix_customer_partner_card_image_and_modal_area.py
          fi
      - name: Verify protected files unchanged
        run: sha256sum -c /tmp/protected.sha256
      - name: Verify Customer partner fixes
        run: |
          grep -q 'WENIK CUSTOMER PARTNER CARD IMAGE + MODAL AREA FIX V1' index.html
          grep -q 'data-wenik-partner-id' index.html
          grep -q 'hideWenikAreaSearchForDetail(true)' index.html
          grep -q 'observeWenikPartnerCardImages' index.html
      - name: Verify only index.html changed
        run: |
          CHANGED="$(git status --short)"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            exit 0
          fi
          if [ "$(git status --short | wc -l)" -ne 1 ] || ! git status --short | grep -q 'index.html'; then
            echo 'Unexpected files changed; refusing to commit.'
            exit 1
          fi
      - name: Commit Customer upgrade
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Customer partner card image and modal area'
          git push
