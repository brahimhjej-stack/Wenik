name: Apply Admin Create Partner UI
on:
  push:
    paths:
      - 'scripts/add-admin-create-partner-ui.py'
      - '.github/workflows/apply-admin-create-partner-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected hashes
        run: |
          sha256sum index.html partner.html sw.js > /tmp/protected.before
      - name: Apply guarded patch
        run: python3 scripts/add-admin-create-partner-ui.py
      - name: Verify protected files unchanged
        run: |
          sha256sum index.html partner.html sw.js > /tmp/protected.after
          diff -u /tmp/protected.before /tmp/protected.after
      - name: Verify only admin runtime changed
        run: |
          test "$(git diff --name-only)" = "admin.html"
          grep -q 'WENIK ADMIN CREATE PARTNER UI' admin.html
          grep -q 'admin-create-partner' admin.html
      - name: Commit runtime UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add secure Admin Partner creation flow'
          git push
