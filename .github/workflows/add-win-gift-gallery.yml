name: Add WIN Gift Gallery Preview
on:
  push:
    branches: [staging]
    paths:
      - 'scripts/add_win_gift_gallery.py'
      - '.github/workflows/add-win-gift-gallery.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Protect non-customer files
        run: |
          sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - name: Apply WIN gift gallery
        run: python scripts/add_win_gift_gallery.py
      - name: Verify marker and protected files
        run: |
          grep -q 'WENIK WIN GIFT GALLERY V1' index.html
          sha256sum -c /tmp/protected.sha
      - name: Commit customer preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add WIN gift gallery preview'
          git push origin staging
