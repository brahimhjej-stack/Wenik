name: Apply Admin Finance P&L UI
on:
  push:
    branches: [staging]
    paths:
      - 'scripts/apply_admin_finance_pnl_ui.py'
      - '.github/workflows/apply-admin-finance-pnl-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect customer partner and service worker
        run: sha256sum index.html partner.html sw.js > /tmp/protected.sha
      - name: Apply Finance P&L UI
        run: python scripts/apply_admin_finance_pnl_ui.py
      - name: Verify protected files unchanged
        run: sha256sum -c /tmp/protected.sha
      - name: Verify only admin runtime changed
        run: |
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | grep -vE '^admin\.html$' || true)"
          test -z "$BAD"
      - name: Commit Admin Finance P&L UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Finance P&L panel to Super Admin'
          git push
