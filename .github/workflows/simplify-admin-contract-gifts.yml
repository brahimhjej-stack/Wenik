name: Simplify Admin contract gifts
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'scripts/simplify_admin_contract_gifts.py'
      - '.github/workflows/simplify-admin-contract-gifts.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Protect non-admin runtime files
        run: sha256sum index.html partner.html sw.js > /tmp/protected.sha
      - name: Apply Admin contract gift UI
        run: python scripts/simplify_admin_contract_gifts.py
      - name: Verify safety
        run: |
          sha256sum -c /tmp/protected.sha
          git diff --exit-code -- index.html partner.html sw.js
          test "$(git diff --name-only | sort)" = "admin.html"
          grep -q 'WENIK ADMIN CONTRACT GIFTS UI' admin.html
          grep -q 'admin_create_partner_gift' admin.html
          grep -q 'Partners do not edit gifts' admin.html
      - name: Commit staging preview
        run: |
          git config user.name 'wenik-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add simple Admin contract gift entry on staging'
          git push origin staging
