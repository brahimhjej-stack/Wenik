name: Upgrade Super Admin UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-super-admin-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Super Admin safely
        run: python scripts/upgrade-super-admin-ui.py
      - name: Verify protected app files untouched
        run: |
          git diff --exit-code -- index.html partner.html sw.js
          git diff --check
          grep -q "super_admin_update_admin" admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "Upgrade Super Admin access controls"
          git push
