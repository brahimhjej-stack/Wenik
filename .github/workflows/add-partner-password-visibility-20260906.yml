name: Add partner password visibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-partner-password-visibility-20260906.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add show hide password control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('partner.html')
          s=p.read_text()
          old='''  <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password">'''
          new='''  <div style="position:relative">
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" style="padding-right:58px">
    <button id="togglePassword" type="button" aria-label="Show password" title="Show password" style="position:absolute;right:10px;top:23px;width:42px;height:42px;border:0;border-radius:14px;background:transparent;color:#fff;font-size:21px;cursor:pointer">👁</button>
  </div>'''
          if old not in s:
              raise SystemExit('password field target not found')
          s=s.replace(old,new,1)
          anchor="$('loginBtn').onclick=async()=>"
          js="""$('togglePassword').onclick=()=>{const f=$('password'),show=f.type==='password';f.type=show?'text':'password';$('togglePassword').textContent=show?'🙈':'👁';$('togglePassword').setAttribute('aria-label',show?'Hide password':'Show password');$('togglePassword').title=show?'Hide password':'Show password'};\n"""
          if anchor not in s:
              raise SystemExit('login handler target not found')
          s=s.replace(anchor,js+anchor,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partner.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add show hide password to partner login'
          git push
