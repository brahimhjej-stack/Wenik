name: Tune customer join mobile UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-customer-home-ui-20260906.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply customer join mobile polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* WENIK CUSTOMER JOIN MOBILE POLISH V3 */'
          if marker in s:
              raise SystemExit('already applied')
          css='''\n/* WENIK CUSTOMER JOIN MOBILE POLISH V3 */\n#auth{padding:20px 16px 18px!important;border-radius:25px!important}\n#auth .eyebrow{font-size:11px!important;line-height:1.2!important;font-weight:950!important;letter-spacing:2.1px!important;color:#d72ac8!important;text-shadow:none!important;opacity:1!important}\n#auth h1,#auth h2{margin:7px 0 14px!important;line-height:1!important}\n#auth .tabs{margin:0 0 13px!important}\n#auth .hint,#auth>.muted{font-size:13px!important;line-height:1.35!important;color:#5d5963!important}\n#auth input{min-height:52px!important;padding:12px 15px!important;border-radius:18px!important}\n#auth .btn{min-height:48px!important;border-radius:17px!important}\n@media(max-width:520px){.app{padding-left:12px!important;padding-right:12px!important}#auth{padding:17px 14px 16px!important;border-radius:23px!important}#auth .eyebrow{font-size:10.5px!important;letter-spacing:1.8px!important;color:#cf22bf!important}#auth h1,#auth h2{font-size:31px!important;margin:6px 0 12px!important}#auth .tabs button{min-height:46px!important;font-size:13px!important}#auth input{min-height:49px!important;font-size:15px!important;margin-bottom:9px!important}#auth .btn{min-height:46px!important}}\n'''
          s=s.replace('\n</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish customer join screen for mobile'
          git push origin main
