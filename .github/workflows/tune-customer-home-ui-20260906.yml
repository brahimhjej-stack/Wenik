name: Tune customer join mobile UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-customer-home-ui-20260906.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply customer join mobile polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* WENIK CUSTOMER JOIN MOBILE POLISH V4 */'
          if marker in s:
              raise SystemExit('already applied')
          css='''\n/* WENIK CUSTOMER JOIN MOBILE POLISH V4 */\n#auth{padding:18px 16px 18px!important;border-radius:24px!important;background:linear-gradient(150deg,rgba(151,73,255,.22),rgba(239,21,157,.11) 45%,rgba(255,122,26,.10) 78%,rgba(255,196,0,.07))!important}\n#auth .eyebrow{display:inline-flex!important;align-items:center!important;width:auto!important;padding:6px 10px!important;margin-bottom:2px!important;border-radius:999px!important;background:linear-gradient(90deg,rgba(109,40,217,.14),rgba(239,21,157,.13),rgba(255,122,26,.10))!important;border:1px solid rgba(167,56,214,.16)!important;color:#8f24c8!important;font-size:10.5px!important;line-height:1!important;font-weight:950!important;letter-spacing:1.55px!important;text-shadow:none!important;opacity:1!important}\n#auth h2{font-size:32px!important;margin:8px 0 12px!important}\n#auth .authTabs{margin:0 0 10px!important;padding:3px!important;border-radius:16px!important}\n#auth .authTab{min-height:43px!important;padding:9px!important;border-radius:13px!important}\n#auth #joinForm>.muted,#auth #loginForm>.muted{margin:8px 0 7px!important;font-size:12.5px!important;line-height:1.3!important;color:#5f5867!important}\n#auth .field{min-height:48px!important;padding:11px 14px!important;margin-top:8px!important;border-radius:16px!important;font-size:15px!important}\n#auth .btn{min-height:46px!important;margin-top:8px!important;border-radius:16px!important}\n@media(max-width:520px){.app{padding-left:11px!important;padding-right:11px!important}#auth{padding:15px 13px 16px!important;border-radius:22px!important}#auth .eyebrow{font-size:9.5px!important;letter-spacing:1.35px!important;padding:5px 9px!important}#auth h2{font-size:29px!important;margin:7px 0 10px!important}#auth .authTab{min-height:41px!important;font-size:12.5px!important}#auth #joinForm>.muted,#auth #loginForm>.muted{font-size:12px!important;margin:7px 0 5px!important}#auth .field{min-height:46px!important;margin-top:7px!important;padding:10px 13px!important}#auth .btn{min-height:44px!important}}\n'''
          s=s.replace('\n</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve WENIK welcome visibility and mobile join layout'
          git push origin main
