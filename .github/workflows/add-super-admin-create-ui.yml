name: Add Super Admin Create UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-super-admin-create-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Admin only
        run: python scripts/add-super-admin-create-ui.py
      - name: Verify protected files untouched
        run: |
          git diff --exit-code -- index.html partner.html sw.js
          git diff --check
          grep -q 'super-admin-create-admin' admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "Add secure Super Admin account creation"
          git push
