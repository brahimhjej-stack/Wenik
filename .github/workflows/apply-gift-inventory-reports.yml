name: Apply Gift Inventory Reports
on:
  push:
    paths:
      - 'scripts/add-gift-inventory-reports.py'
      - '.github/workflows/apply-gift-inventory-reports.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record protected hashes
        run: |
          sha256sum index.html sw.js > /tmp/protected.sha
      - name: Apply guarded patch
        run: python scripts/add-gift-inventory-reports.py
      - name: Verify protected files unchanged
        run: sha256sum -c /tmp/protected.sha
      - name: Verify only intended runtime files changed
        run: |
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | grep -vE '^(admin\.html|partner\.html)$' || true)"
          test -z "$BAD"
      - name: Commit runtime UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html partner.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add gift inventory reports and quantities'
          git push
