name: Apply Partner Profile Completion
on:
  push:
    paths:
      - 'scripts/complete-partner-profile-login-and-gifts.py'
      - 'scripts/sync_partner_profile_areas.py'
      - 'scripts/fix_partner_media_upload_feedback.py'
      - '.github/workflows/apply-partner-profile-completion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected hashes
        run: |
          sha256sum index.html admin.html sw.js > /tmp/protected.before
      - name: Apply guarded profile patches
        run: |
          if grep -q 'WENIK PARTNER PROFILE AREA SYNC V1' partner.html; then
            echo 'Partner area sync already applied'
          else
            python3 scripts/sync_partner_profile_areas.py
          fi
          if grep -q 'WENIK PARTNER MEDIA UPLOAD DIAGNOSTICS V1' partner.html; then
            echo 'Partner media diagnostics already applied'
          else
            python3 scripts/fix_partner_media_upload_feedback.py
          fi
      - name: Verify protected files unchanged
        run: |
          sha256sum index.html admin.html sw.js > /tmp/protected.after
          diff -u /tmp/protected.before /tmp/protected.after
      - name: Verify only partner runtime changed
        run: |
          test "$(git diff --name-only)" = "partner.html"
          grep -q 'WENIK PARTNER PROFILE COMPLETION V2' partner.html
          grep -q 'WENIK PARTNER PROFILE AREA SYNC V1' partner.html
          grep -q 'WENIK PARTNER MEDIA UPLOAD DIAGNOSTICS V1' partner.html
          grep -q '<option>Nabatieh</option>' partner.html
          grep -q '<option>Saida</option>' partner.html
      - name: Commit runtime UI
        run: |
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add partner.html
          git commit -m 'Improve Partner image upload diagnostics'
          git push
