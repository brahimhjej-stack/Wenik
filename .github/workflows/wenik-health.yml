name: WENIK Availability
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/check_wenik_health.py, .github/workflows/wenik-health.yml]
permissions:
  contents: read
concurrency:
  group: wenik-availability
  cancel-in-progress: true
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check website and public partner API
        run: python3 scripts/check_wenik_health.py
