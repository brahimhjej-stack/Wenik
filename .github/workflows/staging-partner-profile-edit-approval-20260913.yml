name: Staging partner profile edit approval
on:
  push:
    branches: [staging]
    paths:
      - 'scripts/add_partner_profile_edit_approval_20260913.py'
      - '.github/workflows/staging-partner-profile-edit-approval-20260913.yml'
      - '.staging-partner-profile-edit-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch partner and admin only
        run: python scripts/add_partner_profile_edit_approval_20260913.py
      - name: Verify scope
        run: |
          git diff --exit-code -- . ':!partner.html' ':!admin.html'
          git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet -- partner.html admin.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'WENIK staging automation'
          git config user.email 'actions@users.noreply.github.com'
          git add partner.html admin.html
          git commit -m 'Add partner profile edit approval flow on staging'
          git push origin staging