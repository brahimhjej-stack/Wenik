name: Add WENIK Cares Preview
on:
  push:
    branches: [staging]
    paths:
      - 'scripts/add_wenik_cares_preview.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/add_wenik_cares_preview.py
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add WENIK Cares opening preview"
          git push origin staging
