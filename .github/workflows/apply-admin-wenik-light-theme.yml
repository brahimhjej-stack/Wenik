name: Apply WENIK admin light identity
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-admin-wenik-light-theme.yml'
      - 'scripts/apply_admin_wenik_light_theme.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect customer partner and service worker
        run: sha256sum index.html partner.html sw.js > /tmp/protected.sha256
      - name: Apply Admin and Super Admin WENIK identity
        run: python3 scripts/apply_admin_wenik_light_theme.py
      - name: Verify protected files
        run: sha256sum -c /tmp/protected.sha256
      - name: Verify only admin changed
        run: |
          CHANGED="$(git status --short)"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then exit 0; fi
          if [ "$(git status --short | wc -l)" -ne 1 ] || ! git status --short | grep -q 'admin.html'; then exit 1; fi
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Apply WENIK light identity to Admin and Super Admin'
          git push
