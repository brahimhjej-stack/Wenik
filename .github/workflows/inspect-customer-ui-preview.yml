name: Inspect customer UI preview

on:
  push:
    branches:
      - customer-ui-refresh-preview-20260906
    paths:
      - .github/workflows/inspect-customer-ui-preview.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture customer UI structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          pats=['loginPassword','Join','JOIN','Welcome','WELCOME','dashboard','Dashboard','HOME','home','logo','brand','nav','screen','panel']
          lines=s.splitlines()
          out=[]
          seen=set()
          for pat in pats:
              for i,line in enumerate(lines):
                  if pat.lower() in line.lower():
                      a=max(0,i-5); b=min(len(lines),i+8)
                      key=(a,b)
                      if key in seen: continue
                      seen.add(key)
                      out.append(f'\n--- {pat} lines {a+1}-{b} ---')
                      for j in range(a,b):
                          clean=lines[j]
                          if 'base64,' in clean:
                              clean=clean.split('base64,',1)[0]+'base64,[omitted]'
                          out.append(f'{j+1}: {clean[:700]}')
          out.append('\n--- IDs ---')
          ids=re.findall(r'id=["\']([^"\']+)',s)
          out.append(', '.join(ids[:400]))
          Path('customer-ui-structure.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit inspection snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-ui-structure.txt
          git commit -m "Capture customer UI structure" || exit 0
          git push
