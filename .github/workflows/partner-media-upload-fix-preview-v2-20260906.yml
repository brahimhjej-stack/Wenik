name: Partner media upload fix preview v2

on:
  push:
    branches:
      - partner-media-upload-fix-preview-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner-media-upload-fix-preview-20260906
          fetch-depth: 0
      - name: Patch partner media upload
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path=Path('partner.html')
          text=path.read_text(encoding='utf-8')
          start=text.index('async function loadMedia()')
          end=text.index('\nfunction giftEsc',start)
          new=base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          path.write_text(text[:start]+new+text[end:],encoding='utf-8')
          PY
      - name: Commit preview patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix and optimize partner media uploads"
          git push origin HEAD:partner-media-upload-fix-preview-20260906
