name: Upgrade Admin Dashboard Mobile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_admin_dashboard_mobile_v1.py'
      - '.github/workflows/upgrade-admin-dashboard-mobile-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture protected hashes
        run: sha256sum index.html partner.html sw.js > /tmp/protected.sha256
      - name: Apply Admin Dashboard polish
        run: python3 scripts/upgrade_admin_dashboard_mobile_v1.py
      - name: Verify marker and protected files
        run: |
          grep -q 'WENIK ADMIN DASHBOARD MOBILE POLISH V1' admin.html
          grep -q 'homeAdUploadBtn' admin.html
          grep -q 'Display order' admin.html
          grep -q 'Priority' admin.html
          sha256sum -c /tmp/protected.sha256
          git diff --check
      - name: Verify only admin.html changed
        run: |
          CHANGED="$(git status --short)"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then exit 0; fi
          if [ "$(git status --short | wc -l)" -ne 1 ] || ! git status --short | grep -q 'admin.html'; then
            echo 'Unexpected files changed; refusing to commit.'
            exit 1
          fi
      - name: Commit Admin Dashboard upgrade
        run: |
          if git diff --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Polish WENIK Admin Dashboard for mobile'
          git push
