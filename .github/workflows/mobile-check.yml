name: WENIK Mobile Check
on:
  push:
    branches: [mobile-app]
  pull_request:
    branches: [mobile-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare official WENIK app icon
        run: mkdir -p assets && cp ../wenik-logo-final.png assets/app-icon.png
      - run: npm ci --ignore-scripts
      - name: Validate Android and iOS JavaScript bundles
        run: npm run export:native
      - run: npx expo export --platform web --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wenik-mobile-preview
          path: mobile/dist
          retention-days: 7
