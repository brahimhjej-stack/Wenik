name: Polish WENIK customer home v6
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/polish-customer-home-v6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: staging}
      - name: Protect Admin Partner service worker
        run: sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - name: Apply customer visual polish
        run: python scripts/polish_customer_home_v6.py
      - name: Verify customer-only scope
        run: |
          sha256sum -c /tmp/protected.sha
          grep -q 'WENIK HOME POLISH V6' index.html
          test "$(git diff --name-only)" = "index.html"
      - name: Commit staging preview
        run: |
          git config user.name 'wenik-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish WENIK customer home on staging'
          git push origin staging
