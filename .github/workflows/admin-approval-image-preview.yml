name: Admin approval image preview
on:
  push:
    branches: [admin-approval-image-preview-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-approval-image-preview-20260906
      - name: Patch admin approvals
        run: |
          echo '' | base64 -d > /tmp/admin_patch.py
          python /tmp/admin_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || (git commit -m "Fix admin image approvals and full-size preview" && git push)
