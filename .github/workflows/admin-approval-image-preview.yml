name: Admin approval image preview

on:
  push:
    branches:
      - admin-approval-image-preview-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-approval-image-preview-20260906

      - name: Patch admin approvals
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()

          css = '''
.approvalImg{width:100%;max-height:280px;object-fit:contain;border-radius:16px;margin-top:12px;border:1px solid rgba(178,92,255,.22);background:#070610;cursor:zoom-in}
.approvalHint{font-size:12px;color:#b9b4c8;margin-top:7px;text-align:center}
.imageViewer{position:fixed;inset:0;background:rgba(2,1,8,.92);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px}
.imageViewer.hidden{display:none!important}.imageViewerBox{width:min(980px,100%);max-height:94vh;overflow:auto;background:#0d0b16;border:1px solid rgba(178,92,255,.4);border-radius:24px;padding:14px;box-shadow:0 24px 80px #000}.imageViewerTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.imageViewerClose{width:auto;margin:0;padding:10px 14px}.imageViewer img{display:block;width:100%;max-height:74vh;object-fit:contain;background:#05040a;border-radius:18px}.imageViewerActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
'''
          if '.approvalImg{' not in s:
              s = s.replace('</style></head>', css + '</style></head>')

          modal = '''<div id="approvalImageViewer" class="imageViewer hidden" role="dialog" aria-modal="true" aria-label="Partner image preview"><div class="imageViewerBox"><div class="imageViewerTop"><div><b id="approvalViewerPartner">Partner image</b><div id="approvalViewerSlot" class="muted"></div></div><button id="approvalViewerClose" class="btn secondary imageViewerClose" type="button">CLOSE ✕</button></div><img id="approvalViewerImg" alt="Partner image preview"><div class="imageViewerActions"><button id="approvalViewerApprove" class="btn ok" type="button">APPROVE</button><button id="approvalViewerReject" class="btn danger" type="button">REJECT</button></div></div></div>'''
          if 'id="approvalImageViewer"' not in s:
              s = s.replace('<section id="approvals" class="panel">', modal + '\n<section id="approvals" class="panel">')

          start = s.find('async function loadApprovals(){')
          end = s.find("$('refreshApprovals').onclick=loadApprovals;", start)
          if start < 0 or end < 0:
              raise SystemExit('approval block not found')

          replacement = r'''let approvalViewerAd=null;
function closeApprovalViewer(){$('approvalImageViewer').classList.add('hidden');$('approvalViewerImg').removeAttribute('src');approvalViewerAd=null}
window.openApprovalImage=(id,url,business,slot)=>{approvalViewerAd={id};$('approvalViewerPartner').textContent=business||'Partner image';$('approvalViewerSlot').textContent='Slot '+slot+' · PENDING';$('approvalViewerImg').src=url;$('approvalImageViewer').classList.remove('hidden')};
$('approvalViewerClose').onclick=closeApprovalViewer;
$('approvalImageViewer').onclick=e=>{if(e.target===$('approvalImageViewer'))closeApprovalViewer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApprovalViewer()});
$('approvalViewerApprove').onclick=async()=>{if(!approvalViewerAd)return;const id=approvalViewerAd.id;closeApprovalViewer();await review('ad',id,'approved')};
$('approvalViewerReject').onclick=async()=>{if(!approvalViewerAd)return;const id=approvalViewerAd.id;closeApprovalViewer();await review('ad',id,'rejected')};
async function loadApprovals(){try{const[rawAds,items]=await Promise.all([rpc('admin_pending_ads'),rpc('admin_pending_items')]);const ads=(rawAds||[]).filter(a=>String(a.image_url||'').trim());$('pendingAds').innerHTML=ads.map(a=>'<div class="card"><div class="row"><b>'+esc(a.business_name)+'</b><span class="pill">Slot '+a.slot_no+'</span></div><h3>'+esc(a.title||'Partner ad')+'</h3><img class="approvalImg" loading="lazy" decoding="async" src="'+esc(a.image_url)+'" alt="Partner image" data-ad-id="'+esc(a.id)+'" data-business="'+esc(a.business_name||'')+'" data-slot="'+esc(a.slot_no)+'"><div class="approvalHint">Tap image to view full size before approval</div><div class="actions"><button class="btn ok" onclick="review(\'ad\',\''+a.id+'\',\'approved\')">APPROVE</button><button class="btn danger" onclick="review(\'ad\',\''+a.id+'\',\'rejected\')">REJECT</button></div></div>').join('')||'<div class="card muted">No pending uploaded images.</div>';document.querySelectorAll('#pendingAds .approvalImg').forEach(img=>img.onclick=()=>openApprovalImage(img.dataset.adId,img.src,img.dataset.business,img.dataset.slot));$('pendingItems').innerHTML=(items||[]).map(i=>'<div class="card"><b>'+esc(i.business_name)+'</b><h3>'+esc(i.name)+'</h3><div class="muted">'+esc(i.category||'')+' · '+money(i.regular_price)+' → '+money(i.wenik_price)+'</div>'+(i.image_url?'<img class="itemImg" src="'+esc(i.image_url)+'" alt="">':'')+'<div class="actions"><button class="btn ok" onclick="review(\'item\',\''+i.id+'\',\'approved\')">APPROVE</button><button class="btn danger" onclick="review(\'item\',\''+i.id+'\',\'rejected\')">REJECT</button></div></div>').join('')||'<div class="card muted">No pending items.</div>'}catch(e){$('pendingAds').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Commit patched admin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix admin image approvals and full-size preview [skip ci]"
            git push
          fi
