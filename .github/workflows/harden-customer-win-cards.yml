name: Harden customer WIN cards
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'scripts/harden_customer_win_cards.py'
      - '.github/workflows/harden-customer-win-cards.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Protect non-customer runtime files
        run: sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - name: Harden customer WIN cards
        run: python scripts/harden_customer_win_cards.py
      - name: Verify safety and semantics
        run: |
          sha256sum -c /tmp/protected.sha
          git diff --exit-code -- admin.html partner.html sw.js
          test "$(git diff --name-only | sort)" = "index.html"
          grep -q "const logoUrl=safeUrl(x.partner_logo_url)" index.html
          grep -q "const value=''" index.html
          ! grep -q "const value=x.stated_value" index.html
      - name: Commit staging preview
        run: |
          git config user.name 'wenik-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Harden customer WIN cards on staging'
          git push origin staging
