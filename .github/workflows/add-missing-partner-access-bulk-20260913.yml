name: Add missing partner access bulk
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch admin only
        run: python scripts/add_missing_partner_access_bulk_20260913.py
      - name: Verify scope
        run: |
          git diff --exit-code -- index.html partner.html sw.js || true
          changed=$(git status --short | awk '{print $2}' | grep -v '^admin.html$' | grep -v '^$' || true)
          if [ -n "$changed" ]; then echo "Unexpected changed files: $changed"; exit 1; fi
      - name: Commit changes
        run: |
          if git diff --quiet -- admin.html; then echo 'No admin changes'; exit 0; fi
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add missing Partner access tool on staging'
          git push origin HEAD:staging
