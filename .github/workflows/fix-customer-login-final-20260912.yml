name: Fix WENIK customer login final
on:
  push:
    paths:
      - 'scripts/fix_customer_login_final_20260912.py'
      - '.github/workflows/fix-customer-login-final-20260912.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix customer login only
        run: python scripts/fix_customer_login_final_20260912.py
      - name: Verify only index changed
        run: |
          changed=$(git status --short | awk '{print $2}' | grep -v '^$' || true)
          test "$changed" = "index.html"
      - name: Commit
        run: |
          git config user.name "WENIK automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix customer login binding only"
          git push origin main
