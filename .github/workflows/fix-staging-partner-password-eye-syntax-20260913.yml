name: Fix staging partner password eye syntax
on:
  push:
    branches: [staging]
    paths:
      - 'scripts/fix_staging_partner_password_eye_syntax_20260913.py'
      - '.github/workflows/fix-staging-partner-password-eye-syntax-20260913.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Protect unrelated runtime files
        run: sha256sum index.html admin.html sw.js > /tmp/protected.before
      - name: Fix one partner syntax error only
        run: python scripts/fix_staging_partner_password_eye_syntax_20260913.py
      - name: Verify scope
        run: |
          sha256sum index.html admin.html sw.js > /tmp/protected.after
          diff -u /tmp/protected.before /tmp/protected.after
          test "$(git diff --name-only)" = "partner.html"
          grep -Fq "input.type=showing?'password':'text';" partner.html
      - name: Commit
        run: |
          git config user.name 'WENIK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add partner.html
          git commit -m 'Fix staging partner password eye syntax only'
          git push
