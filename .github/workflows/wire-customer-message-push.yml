name: Wire customer message phone push
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-customer-message-push.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch admin safely
        run: python scripts/wire-customer-message-push.py
      - name: Verify protected customer and partner files untouched
        run: |
          git diff --exit-code -- index.html partner.html
          git diff --check
          grep -q "sendExternalPush(id)" admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "Enable phone push for customer messages"
          git push
