name: Partner gallery camera preview
on:
  push:
    branches: [partner-media-upload-clean-preview-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner-media-upload-clean-preview-20260906
      - name: Add gallery and camera controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('partner.html')
          s=p.read_text()
          old="""'<input id=\"mediaFile-'+i+'\" type=\"file\" accept=\"image/jpeg,image/png,image/webp\" style=\"display:none\"><button class=\"btn secondary\" data-media-slot=\"'+i+'\">CHOOSE & UPLOAD IMAGE '+i+'</button><div id=\"mediaSlotMsg-'+i+'\" class=\"muted\"></div></div>'"""
          new="""'<input id=\"mediaGallery-'+i+'\" type=\"file\" accept=\"image/*\" style=\"display:none\"><input id=\"mediaCamera-'+i+'\" type=\"file\" accept=\"image/*\" capture=\"environment\" style=\"display:none\"><button class=\"btn secondary\" data-gallery-slot=\"'+i+'\">🖼️ CHOOSE FROM GALLERY</button><button class=\"btn secondary\" data-camera-slot=\"'+i+'\">📷 TAKE PHOTO</button><div id=\"mediaSlotMsg-'+i+'\" class=\"muted\"></div></div>'"""
          if old not in s:
              raise SystemExit('media control marker not found')
          s=s.replace(old,new,1)
          old2="""document.querySelectorAll('[data-media-slot]').forEach(btn=>{const slot=Number(btn.dataset.mediaSlot),input=$('mediaFile-'+slot);btn.onclick=()=>input.click();input.onchange=()=>input.files?.[0]&&uploadMedia(slot,input.files[0],btn)});"""
          new2="""document.querySelectorAll('[data-gallery-slot]').forEach(btn=>{const slot=Number(btn.dataset.gallerySlot),input=$('mediaGallery-'+slot);btn.onclick=()=>input.click();input.onchange=()=>input.files?.[0]&&uploadMedia(slot,input.files[0],btn)});document.querySelectorAll('[data-camera-slot]').forEach(btn=>{const slot=Number(btn.dataset.cameraSlot),input=$('mediaCamera-'+slot);btn.onclick=()=>input.click();input.onchange=()=>input.files?.[0]&&uploadMedia(slot,input.files[0],btn)});"""
          if old2 not in s:
              raise SystemExit('media handler marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner.html
          git diff --cached --quiet || (git commit -m "Add gallery and camera image upload choices" && git push)
