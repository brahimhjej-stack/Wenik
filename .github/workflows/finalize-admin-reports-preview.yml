name: Finalize Admin Reports Preview
on:
  push:
    branches: [reports-final-preview-20260905]
    paths:
      - 'scripts/finalize_admin_reports.py'
      - '.github/workflows/finalize-admin-reports-preview.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reports-final-preview-20260905
          fetch-depth: 0
      - name: Protect non-target runtime files
        run: sha256sum index.html partner.html sw.js > /tmp/protected.sha
      - name: Apply final Reports patch
        run: python scripts/finalize_admin_reports.py
      - name: Verify protected files unchanged
        run: sha256sum -c /tmp/protected.sha
      - name: Verify only Admin runtime changed
        run: |
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | grep -vE '^admin\.html$' || true)"
          test -z "$BAD"
      - name: Commit final Reports preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize Admin reports preview'
          git push origin reports-final-preview-20260905
