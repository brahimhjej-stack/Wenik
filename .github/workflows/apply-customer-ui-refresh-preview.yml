name: Apply customer UI refresh preview

on:
  push:
    branches:
      - customer-ui-refresh-preview-20260906
    paths:
      - .github/workflows/apply-customer-ui-refresh-preview.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- WENIK CUSTOMER UI REFRESH PREVIEW V1 -->'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          css=r'''
          /* WENIK CUSTOMER UI REFRESH PREVIEW V1 */
          :root{--wenik-violet:#6d28d9;--wenik-pink:#ef159d;--wenik-coral:#ff3f64;--wenik-orange:#ff7a1a;--wenik-yellow:#ffc400}
          .app{padding-top:12px!important}
          .top{display:flex!important;justify-content:center!important;align-items:center!important;padding:12px 0 14px!important}
          .brandLogo{width:142px!important;max-width:46vw!important;margin:0 auto!important;filter:drop-shadow(0 10px 24px rgba(239,21,157,.18)) drop-shadow(0 0 28px rgba(255,196,0,.10))!important}
          #auth{margin-top:6px!important;border-radius:30px!important;padding:24px 20px 22px!important;background:linear-gradient(145deg,rgba(109,40,217,.23),rgba(239,21,157,.12) 42%,rgba(255,122,26,.12) 72%,rgba(255,196,0,.08))!important;border:1px solid rgba(255,255,255,.11)!important;box-shadow:0 24px 70px rgba(0,0,0,.30)!important}
          #auth:before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--wenik-violet),var(--wenik-pink),var(--wenik-coral),var(--wenik-orange),var(--wenik-yellow));border-radius:30px 30px 0 0}
          #auth .eyebrow{letter-spacing:2.2px!important;font-weight:800!important;color:#ffb5df!important}
          #auth h2{font-size:34px!important;line-height:1!important;margin:8px 0 16px!important}
          #auth .authTabs{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.08)!important;padding:4px!important;border-radius:18px!important}
          #auth .authTab{border-radius:14px!important;min-height:44px!important}
          #auth .field{min-height:52px!important;border-radius:17px!important}
          #auth .btn{min-height:50px!important;border-radius:17px!important;font-weight:850!important;letter-spacing:.4px!important}

          /* WENIK PROMO TICKER V1 */
          .wenikPromoTicker{position:relative;overflow:hidden;display:flex;align-items:center;min-height:38px;margin:0 0 12px;border-radius:15px;background:linear-gradient(100deg,rgba(109,40,217,.20),rgba(239,21,157,.14),rgba(255,122,26,.14),rgba(255,196,0,.12));border:1px solid rgba(255,255,255,.10);box-shadow:0 9px 26px rgba(0,0,0,.16)}
          .wenikPromoDot{width:8px;height:8px;flex:0 0 8px;margin-left:14px;border-radius:50%;background:var(--wenik-yellow);box-shadow:0 0 14px rgba(255,196,0,.75)}
          .wenikPromoText{flex:1;text-align:center;padding:8px 14px 8px 8px;font-size:11px;font-weight:900;letter-spacing:1.25px;color:#fff;transition:opacity .22s ease,transform .22s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .wenikPromoText.isChanging{opacity:0;transform:translateY(5px)}

          #home>.hero{margin-top:2px!important;padding:24px 21px!important;border-radius:29px!important;background:radial-gradient(circle at 90% 5%,rgba(255,196,0,.16),transparent 30%),linear-gradient(145deg,rgba(109,40,217,.26),rgba(239,21,157,.12) 46%,rgba(255,122,26,.12))!important;border:1px solid rgba(255,255,255,.11)!important;box-shadow:0 22px 60px rgba(0,0,0,.24)!important}
          #home>.hero:after{content:'WIN  •  DISCOVER  •  SAVE';display:inline-flex;margin-top:15px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);font-size:10px;font-weight:900;letter-spacing:1.45px;color:#fff}
          #home>.hero .eyebrow{color:#ffb5df!important;font-weight:850!important;letter-spacing:2.1px!important}
          #home>.hero h2{font-size:31px!important;line-height:1.04!important;margin-top:8px!important}
          #home .sectionTitle{margin-top:23px!important;margin-bottom:9px!important;align-items:end!important}
          #home .sectionTitle h3{font-size:15px!important;letter-spacing:1.1px!important}
          #carousel{border-radius:25px!important;overflow:hidden!important;box-shadow:0 18px 45px rgba(0,0,0,.20)!important}
          #homePartnerDiscovery{border-radius:27px!important;padding:18px!important;background:linear-gradient(155deg,rgba(255,255,255,.09),rgba(255,255,255,.045))!important;border:1px solid rgba(255,255,255,.10)!important;box-shadow:0 18px 45px rgba(0,0,0,.18)!important}
          #homePartnerDiscovery .field,#homePartnerDiscovery .btn{border-radius:16px!important}
          .wenikDiscoveryTitle{font-size:16px!important;font-weight:900!important;letter-spacing:.25px!important}
          #nav{box-shadow:0 -14px 45px rgba(0,0,0,.34)!important;border-top:1px solid rgba(255,255,255,.10)!important;backdrop-filter:blur(22px)!important}
          @media(max-width:420px){.brandLogo{width:132px!important}.wenikPromoText{font-size:10px;letter-spacing:1px}#auth{padding:22px 17px!important}#home>.hero h2{font-size:29px!important}}
          '''
          if '</style>' not in s: raise SystemExit('Missing </style>')
          s=s.replace('</style>',css+'\n</style>',1)

          anchor='\n  <section id="auth" class="hero">'
          if anchor not in s: raise SystemExit('Auth anchor not found')
          promo='''\n  <!-- WENIK PROMO TICKER V1 -->\n  <div class="wenikPromoTicker" aria-live="polite"><span class="wenikPromoDot"></span><span id="wenikPromoText" class="wenikPromoText">WENIK — WIN MORE. DISCOVER MORE.</span></div>\n'''
          s=s.replace(anchor,promo+anchor,1)

          old='<div class="hero"><div class="eyebrow">MORE TO DISCOVER</div><h2>Welcome to WENIK</h2><div class="muted">Offers, prizes and new opportunities in one place.</div></div>'
          new='<div class="hero"><div class="eyebrow">YOUR WENIK</div><h2>Everything starts here.</h2><div class="muted">Discover partners, unlock benefits and keep your next win close.</div></div>'
          if old not in s: raise SystemExit('Home hero anchor not found')
          s=s.replace(old,new,1)

          js=r'''
          <script>
          /* WENIK PROMO TICKER V1 */
          (()=>{
            const messages=[
              'WENIK — WIN MORE. DISCOVER MORE.',
              'NEW PARTNERS. NEW BENEFITS. EVERY DAY.',
              'YOUR NEXT WIN COULD BE CLOSER THAN YOU THINK.',
              'CONTACT US — WE’D LOVE TO HEAR FROM YOU.',
              'DISCOVER • SAVE • WIN WITH WENIK'
            ];
            let i=0;
            const rotate=()=>{
              const el=document.getElementById('wenikPromoText');
              if(!el)return;
              el.classList.add('isChanging');
              setTimeout(()=>{i=(i+1)%messages.length;el.textContent=messages[i];el.classList.remove('isChanging')},220);
            };
            window.setInterval(rotate,3800);
          })();
          </script>
          '''
          if '</body>' not in s: raise SystemExit('Missing </body>')
          s=s.replace('</body>',js+'\n</body>',1)

          if s.count('WENIK PROMO TICKER V1') < 3: raise SystemExit('Ticker patch verification failed')
          if 'WENIK CUSTOMER UI REFRESH PREVIEW V1' not in s: raise SystemExit('UI marker missing')
          p.write_text(s,encoding='utf-8')
          print('Customer UI preview patch applied')
          PY
      - name: Validate patch
        run: |
          grep -q "WENIK CUSTOMER UI REFRESH PREVIEW V1" index.html
          grep -q "id=\"wenikPromoText\"" index.html
          grep -q "Everything starts here" index.html
          grep -q "id=\"loginPassword\"" index.html
          grep -q "forgotPassword" index.html
      - name: Commit preview patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh customer dashboard and welcome screen" || exit 0
          git push
