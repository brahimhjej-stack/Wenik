name: Compact customer dashboard
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'scripts/compact_customer_dashboard.py'
      - '.github/workflows/compact-customer-dashboard.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Protect non-customer runtime files
        run: sha256sum admin.html partner.html sw.js > /tmp/protected.sha
      - name: Compact customer dashboard
        run: python scripts/compact_customer_dashboard.py
      - name: Verify UI-only safety
        run: |
          sha256sum -c /tmp/protected.sha
          git diff --exit-code -- admin.html partner.html sw.js
          test "$(git diff --name-only | sort)" = "index.html"
          grep -q 'WENIK CUSTOMER COMPACT DASHBOARD V1' index.html
          grep -q '#shell .hero{padding:14px 15px' index.html
          grep -q '.brandLogo{width:76px' index.html
          grep -q '#shell .card{padding:12px' index.html
      - name: Commit staging preview
        run: |
          git config user.name 'wenik-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Compact customer dashboard on staging'
          git push origin staging
